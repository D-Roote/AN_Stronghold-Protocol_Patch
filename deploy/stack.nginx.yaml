name: stronghold

services:
  stronghold:
    image: "${STRONGHOLD_IMAGE:?Run python3 scripts/project.py setup from the project root}"
    build:
      context: "${STRONGHOLD_SOURCE_DIR:?Run python3 scripts/project.py setup from the project root}"
      args:
        FETCH_ASSETS: "${FETCH_ASSETS:-1}"
        VOICE_LANG: "${VOICE_LANG:-kr}"
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      SP_COMBAT: "client"
      SP_VERIFY: "off"
      SP_MAX_BOTS: "1"
      TRUST_PROXY: "auto"
      SP_NO_BROWSER: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: "${LOCAL_ASSETS_DIR:?Set LOCAL_ASSETS_DIR in .env}"
        target: /app/public/assets/local
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${LOCAL_ASSETS_MANIFEST:?Set LOCAL_ASSETS_MANIFEST in .env}"
        target: /app/data/local-assets.json
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_BIND_IP:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      stronghold:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
