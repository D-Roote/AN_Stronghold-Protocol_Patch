user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    autoindex off;
    disable_symlinks on;

    # Error responses and health checks must never be cached as usable media.
    map $status $asset_cache_control {
        200 $asset_success_cache;
        206 $asset_success_cache;
        304 $asset_success_cache;
        default "no-store";
    }
    map $uri $asset_audio_stem {
        ~*^(?<asset_audio_without_ext>.+)\.(mp3|m4a|aac|ogg|oga|opus|wav)$ $asset_audio_without_ext;
        default $uri;
    }
    include /etc/nginx/conf.d/*.conf;
}
